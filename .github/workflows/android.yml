name: Real Android debug build and emulator checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/build_android.sh'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require official SDK and installed Java
        run: |
          java -version
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Build and verify actual ephemeral debug-signed APKs
        run: scripts/build_android.sh
      - name: Launch actual emulator, install APKs and run instrumentation
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/atze-avd"
          export ANDROID_USER_HOME="$RUNNER_TEMP/atze-android-home"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          unset ANDROID_SDK_HOME
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          sudo chmod 666 /dev/kvm
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name atze-test --package 'system-images;android-35;google_apis;x86_64' --device pixel_2 --path "$ANDROID_AVD_HOME/atze-test.avd"
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list avd > reports/android/avd-config.txt
          test -f "$ANDROID_AVD_HOME/atze-test.ini"
          emulator -avd atze-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 1536 > reports/android/emulator.log 2>&1 &
          EMULATOR_PID=$!
          trap 'adb emu kill || true; kill "$EMULATOR_PID" 2>/dev/null || true' EXIT
          export EMULATOR_PID
          python - <<'PYWAIT'
          import os,subprocess,time
          deadline=time.monotonic()+240
          while time.monotonic()<deadline:
              os.kill(int(os.environ['EMULATOR_PID']),0)
              result=subprocess.run(['adb','get-state'],capture_output=True,text=True,timeout=5)
              if result.returncode==0 and result.stdout.strip()=='device': break
              time.sleep(2)
          else: raise SystemExit('Emulator did not attach before deadline')
          PYWAIT
          BOOTED=false
          for i in $(seq 1 180); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then BOOTED=true; break; fi
            sleep 2
          done
          "$BOOTED"
          adb shell input keyevent 82
          adb install -r reports/android/atze-app-debug.apk
          adb install -r reports/android/atze-test-debug.apk
          adb shell am start -W -n de.atze.plana/.MainActivity > reports/android/launch.txt
          timeout 120 adb shell am instrument -w de.atze.plana.test/de.atze.plana.test.CoreClientTest | tee reports/android/instrumentation.txt
          grep -q 'atze_result=PASS' reports/android/instrumentation.txt
          adb shell dumpsys package de.atze.plana > reports/android/installed-package.txt
          echo 'EMULATOR_INSTALL_START_TEST_PASS' > reports/android/validation-status.txt
      - name: Publish actual APK hashes and test outcome in check annotations
        if: always()
        run: |
          python - <<'PYCODE'
          import hashlib,json
          from pathlib import Path
          root=Path('reports/android'); root.mkdir(parents=True,exist_ok=True)
          data={'scope':'real debug artifacts; emulator test not physical hardware','apks':[]}
          for path in sorted(root.glob('atze-*-debug.apk')):
              data['apks'].append({'file':path.name,'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
          for filename in ['build-status.txt','validation-status.txt','instrumentation.txt']:
              path=root/filename
              data[filename]=path.read_text(errors='replace')[-3000:] if path.exists() else 'NOT_RUN'
          if data['validation-status.txt']=='NOT_RUN' and (root/'emulator.log').exists():
              lines=(root/'emulator.log').read_text(errors='replace').splitlines()
              data['emulator_errors']='\n'.join(line for line in lines if line.lstrip().startswith(('ERROR','FATAL')))[:2000]
          (root/'artifact-evidence.json').write_text(json.dumps(data,indent=2)+'\n')
          summary=json.dumps(data,ensure_ascii=True)
          print('::notice title=ANDROID_ARTIFACT_EVIDENCE::'+summary.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PYCODE
      - name: Upload actual APKs and evidence (never the temporary signing key)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug-${{ github.sha }}
          path: |
            reports/android/*.apk
            reports/android/SHA256SUMS
            reports/android/*signature.txt
            reports/android/*status.txt
            reports/android/launch.txt
            reports/android/instrumentation.txt
            reports/android/installed-package.txt
            reports/android/artifact-evidence.json
          retention-days: 14
