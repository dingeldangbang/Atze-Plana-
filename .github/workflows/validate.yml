name: Validate core and documentation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Documentation and OpenAPI consistency
        run: python scripts/docs.py --check
      - name: Unit, integration and security regression
        run: python -m pytest --cov=app --cov-fail-under=90 --cov-report=xml:reports/coverage.xml --junitxml=reports/junit.xml
      - name: Build package
        run: python -m build
      - name: Dependency security audit
        run: pip-audit -r requirements.lock --format json -o reports/dependency-audit.json
      - name: Reality boundary checks
        run: python scripts/reality_check.py
      - name: Real HTTP workflow against self-created disposable test instance
        run: python scripts/smoke.py --allow-fixtures
      - name: Optimized smoke and JavaScript syntax
        run: |
          python -O scripts/smoke.py --allow-fixtures --report reports/smoke-optimized.json
          node --check app/static/app.js
      - name: Real sandboxed Chromium PLAN UI
        run: python scripts/smoke.py --allow-fixtures --browser --report reports/browser-plan.json
      - name: Publish bounded browser validation evidence
        if: always()
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          path=Path('reports/browser-plan.json')
          if path.exists():
              value=json.loads(path.read_text()).get('browser', {'status':'NOT RUN'})
              text=json.dumps(value,ensure_ascii=True).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice title=Browser PLAN evidence::'+text)
          PYTHON
      - name: Upload real validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-${{ github.sha }}
          path: |
            reports/*.xml
            reports/*.json
            reports/*.log
            dist/*
          retention-days: 14
