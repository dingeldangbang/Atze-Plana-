name: Real local model integration (isolated synthetic inputs)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/validate_local_model.py'
      - 'validation/local-model.lock.json'
      - '.github/workflows/local-model.yml'
permissions:
  contents: read
jobs:
  local-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install locked core test dependencies (no model library in core)
        run: pip install -r requirements.lock
      - name: Stage pinned public artifacts over verified HTTPS only
        run: |
          mkdir -p "$RUNNER_TEMP/atze-model-artifacts" reports
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          lock=json.loads(Path('validation/local-model.lock.json').read_text())
          report=Path('reports/local-model-download.json')
          result={'status':'RUNNING','scope':'public pinned artifacts only; no platform data','downloaded':[]}
          report.write_text(json.dumps(result,indent=2))
          try:
              for key in ['runtime','model']:
                  spec=lock[key]
                  destination=Path(os.environ['RUNNER_TEMP'])/'atze-model-artifacts'/spec['filename']
                  subprocess.run(['curl','--fail','--location','--proto','=https','--proto-redir','=https','--tlsv1.2','--connect-timeout','20','--max-time','300','--silent','--show-error',spec['url'],'--output',str(destination)],check=True)
                  from scripts.validate_local_model import verify
                  verify(destination,spec)
                  result['downloaded'].append({'kind':key,'sha256':spec['sha256'],'size':spec['size']})
              result['status']='PASS'
          except Exception as error:
              result.update(status='BLOCKED',error_type=type(error).__name__)
              raise
          finally:
              report.write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Real non-root inference with only loopback networking
        run: |
          PYTHON="$(command -v python)"
          MODEL="$RUNNER_TEMP/atze-model-artifacts/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          RUNTIME="$RUNNER_TEMP/atze-model-artifacts/llama-b10948-bin-ubuntu-x64.tar.gz"
          sudo unshare --net -- sh -c 'ip link set lo up; exec runuser -u "$1" -- "$2" scripts/validate_local_model.py --allow-fixtures --model "$3" --runtime-archive "$4"' sh "$USER" "$PYTHON" "$MODEL" "$RUNTIME"
      - name: Publish bounded result metadata in check annotations
        if: always()
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          path=Path('reports/local-model.json')
          if path.exists():
              data=json.loads(path.read_text())
              keys=['status','model','revision','model_sha256','runtime_sha256','network','uid','actual_output','checks','children_stopped']
              summary=json.dumps({k:data.get(k) for k in keys},ensure_ascii=True)
              print('::notice title=REAL_MODEL_EVIDENCE::'+summary.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PYCODE
      - name: Publish actual reports only (no weights, secrets or raw logs)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-local-model-${{ github.sha }}
          path: reports/local-model*.json
          retention-days: 14
